name: Publicar Ferracine Prod no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v7

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar tipos
        run: pnpm run lint

      - name: Executar testes unitarios
        run: pnpm run test

      - name: Gerar aplicacao
        run: pnpm run build

      - name: Executar testes de ponta a ponta (Chrome do runner)
        run: pnpm run test:e2e

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
