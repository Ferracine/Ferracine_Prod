<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f294a" />
    <meta name="description" content="Folha de Produção Diária: registro das OSs do turno e PDF oficial, funciona sem internet." />
    <title>Folha de Produção Diária - Energisa</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
  </head>
  <body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>
    <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4"></div>

    <header class="bg-energisa-navy text-white shadow-md sticky top-0 z-30">
      <div class="max-w-3xl mx-auto px-4 py-3.5 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <img src="/icon.svg" alt="" class="w-10 h-10 rounded-xl" />
          <div>
            <span class="text-xs font-bold tracking-widest text-energisa-orange uppercase block">Energisa • Operação</span>
            <h1 class="text-base sm:text-lg font-extrabold leading-tight">Folha de Produção Diária</h1>
          </div>
        </div>
        <div class="hidden sm:flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-full text-xs font-medium">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="badge-status" aria-live="polite"></span>
        </div>
      </div>
    </header>

    <main id="app" class="flex-1 max-w-3xl w-full mx-auto px-4 py-6"></main>

    <noscript>Ative o JavaScript para usar a Folha de Produção.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
