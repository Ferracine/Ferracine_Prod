<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d16" />
    <meta name="description" content="Folha de Produção Diária: registro das OSs do turno e Espelho de Campo em PDF, funciona sem internet." />
    <title>Folha de Produção Diária - Energisa</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/pwa-64x64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <script>
      // Estilo e claro/escuro antes da primeira pintura (evita piscar). Mesmas chaves e IDs de src/theme.ts.
      (function () {
        var t, e;
        try { t = localStorage.getItem('ferracine_prod:theme'); e = localStorage.getItem('ferracine_prod:estilo'); } catch (x) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (e === 'retro') e = 'win98';
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.estilo = e && /^(moderno|floresta|sol-forte|win98|xp|win31|win10)$/.test(e) ? e : 'moderno';
      })();
    </script>
  </head>
  <body class="font-sans min-h-screen flex flex-col">
    <!-- Avisos rápidos: centralizados sobre a coluna do app e acima das janelas (#modal é z-50). -->
    <div id="toast-container" class="fixed top-4 inset-x-0 z-[60] mx-auto max-w-sm flex flex-col gap-2 px-4 pointer-events-none"></div>
    <div id="modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4"></div>

    <header class="barra-app sticky top-0 z-30 bg-card/95 border-b border-fg/10">
      <div class="max-w-3xl mx-auto px-4 py-2.5 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <img src="/src/assets/energisa.svg" alt="Grupo Energisa" class="h-9 w-auto shrink-0" />
          <h1 class="text-sm font-extrabold leading-tight text-fg border-l border-fg/15 pl-3">Folha de Produção</h1>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <div class="hidden sm:flex items-center gap-2 bg-fg/5 border border-fg/10 px-3 py-1.5 rounded-full text-xs font-semibold text-muted">
            <span class="w-2 h-2 rounded-full bg-brand animate-pulse"></span>
            <span id="badge-status" aria-live="polite"></span>
          </div>
          <span id="historico-toggle" class="size-11 shrink-0"></span>
          <span id="estilo-toggle" class="size-11 shrink-0"></span>
          <span id="theme-toggle" class="size-11 shrink-0"></span>
        </div>
      </div>
    </header>

    <!-- Aviso de versão nova do APK (src/update.ts). -->
    <div id="update-banner" class="hidden max-w-3xl w-full mx-auto px-4 pt-4" role="status" aria-live="polite"></div>

    <main id="app" class="flex-1 max-w-3xl w-full mx-auto px-4 py-6"></main>

    <footer class="text-center text-xs text-subtle pb-6 px-4 space-y-1">
      <p class="font-semibold">© Ferracine Prod</p>
      <!-- Versão e "Procurar atualização" (src/update.ts). -->
      <p id="app-version"></p>
    </footer>

    <noscript>Ative o JavaScript para usar a Folha de Produção.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
